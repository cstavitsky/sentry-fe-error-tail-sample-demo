# Same-origin front door, like a Django app that also serves the SPA:
#   /                 -> static frontend build
#   /api/, /graphql/  -> Django
#   /otlp/v1/traces   -> OTel Collector OTLP/HTTP receiver (collector:4318/v1/traces)
# Because the browser posts spans to its own origin, the collector needs no CORS
# config and is never exposed publicly. See README "Production hardening" for what a
# public /otlp route needs beyond this demo (rate limits, auth, attribute policing).

# Docker's embedded DNS. Using variables in proxy_pass makes nginx resolve the
# upstream names at request time (cached for `valid`), so a recreated backend or
# collector container with a new IP keeps working without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $django    http://backend:8000;
    set $collector http://collector:4318;

    location / {
        try_files $uri /index.html;
    }

    # proxy_pass with a variable and no URI part passes the original request URI.
    location /api/ {
        proxy_pass $django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /graphql/ {
        proxy_pass $django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Only the one OTLP path the browser transport uses; the /otlp prefix is replaced
    # by the explicit upstream URI (with a variable, a URI in proxy_pass is used as is).
    location = /otlp/v1/traces {
        limit_except POST { deny all; }
        proxy_pass $collector/v1/traces;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        # The transport sends <= 60 KiB chunks; only a single oversized span is bigger.
        client_max_body_size 1m;
        access_log off; # OTLP posts would otherwise dominate the access log
    }

    location /otlp/ {
        return 404;
    }
}
